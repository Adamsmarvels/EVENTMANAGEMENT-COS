# ==== Railway production profile (SAFE TO COMMIT - no real secrets) ====
# Activated on Railway by setting env var:  SPRING_PROFILES_ACTIVE=prod
# The real values come from Railway's Variables tab at runtime.

# Auto-create the tables on first boot (same as local)
spring.jpa.hibernate.ddl-auto=update

# Railway assigns a random port via $PORT - the app MUST bind to it
server.port=${PORT:8080}

# Database - values injected by Railway env vars (see guide)
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# JWT - secret injected by Railway env var
app.jwt.secret=${APP_JWT_SECRET}
app.jwt.expiration-ms=${APP_JWT_EXPIRATION_MS:86400000}
